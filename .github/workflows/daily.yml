name: Daily commit
on:
  schedule:
    - cron: "17 9 * * *"   # every day at 09:17 UTC
  workflow_dispatch:        # lets you run it manually too
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "elufowojud"
          git config user.email "davfowoju@gmail.com"
          date -u >> log.txt
          git add log.txt
          git commit -m "Daily update"
          git push
